<!DOCTYPE html>
<html lang="en">
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BreakText AI - Undetectable AI Humanizer</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  
<script>
// ================= DUAL PAYMENT HANDLERS =================
async function payWithStripe() {
  try {
    const res = await fetch('/api/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ plan: 'pro' })
    });
    const data = await res.json();
    if (data.url) {
      window.location.href = data.url;
    } else {
      alert(data.error || 'Failed to initialize Stripe checkout.');
    }
  } catch (err) {
    alert('Error connecting to Stripe: ' + err.message);
  }
}

async function payWithRazorpay() {
  try {
    // 1. Create order on server
    const res = await fetch('/api/razorpay/create-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: 100 })
    });
    const order = await res.json();

    if (!order.id) {
      alert('Could not initiate Razorpay order. Make sure RAZORPAY_KEY_ID is set in Railway.');
      return;
    }

    // 2. Open Razorpay Checkout modal
    const options = {
      key: window.RAZORPAY_KEY_ID || order.key || 'rzp_test_placeholder',
      amount: order.amount,
      currency: "INR",
      name: "BreakText AI",
      description: "Pro Upgrade (50,000 Words)",
      order_id: order.id,
      handler: async function (response) {
        // 3. Verify signature on backend
        const verifyRes = await fetch('/api/razorpay/verify-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(response)
        });
        const verifyData = await verifyRes.json();
        if (verifyData.success) {
          alert('Payment Successful! Your account has been upgraded to Pro.');
          window.location.reload();
        } else {
          alert('Payment verification failed.');
        }
      },
      prefill: {
        name: "BreakText User",
        email: "user@example.com"
      },
      theme: { color: "#6366f1" }
    };

    const rzp = new Razorpay(options);
    rzp.open();
  } catch (err) {
    alert('Razorpay Checkout error: ' + err.message);
  }
}
window.payWithStripe = payWithStripe;
window.payWithRazorpay = payWithRazorpay;
</script>


<!-- DUAL PAYMENT MODAL -->
<div id="paymentChoiceModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:9999; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
  <div style="background:#1e293b; border:1px solid #334155; border-radius:16px; padding:28px; width:90%; max-width:400px; color:#fff; text-align:center; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">
    <h3 style="margin-top:0; font-size:1.25rem; font-weight:700;">Upgrade to Pro</h3>
    <p style="color:#94a3b8; font-size:0.9rem; margin-bottom:24px;">One-time payment of ₹100. Unlock 50,000 words and deep Turnitin bypass.</p>
    
    <div style="display:flex; flex-direction:column; gap:12px;">
      <button onclick="payWithRazorpay()" style="display:flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; background:#4f46e5; border:none; border-radius:10px; color:#fff; font-weight:600; cursor:pointer; font-size:0.95rem;">
        <span>🇮🇳 UPI / QR Code / Netbanking</span>
        <span style="background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:6px; font-size:0.8rem;">₹100</span>
      </button>

      <button onclick="payWithStripe()" style="display:flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; background:#0f172a; border:1px solid #475569; border-radius:10px; color:#fff; font-weight:600; cursor:pointer; font-size:0.95rem;">
        <span>🌍 Card / Apple Pay / Google Pay</span>
        <span style="background:rgba(255,255,255,0.1); padding:2px 8px; border-radius:6px; font-size:0.8rem;">₹100</span>
      </button>
    </div>

    <button onclick="document.getElementById('paymentChoiceModal').style.display='none'" style="margin-top:18px; background:none; border:none; color:#64748b; font-size:0.85rem; cursor:pointer; text-decoration:underline;">
      Cancel
    </button>
  </div>
</div>

<script>
function openPaymentModal() {
  const m = document.getElementById('paymentChoiceModal');
  if (m) m.style.display = 'flex';
}
window.openPaymentModal = openPaymentModal;

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('button, a').forEach(el => {
    if (el.textContent && (el.textContent.includes('Upgrade') || el.id === 'upgrade-btn')) {
      el.onclick = (e) => {
        e.preventDefault();
        openPaymentModal();
      };
    }
  });
});
</script>
</body>
</html>
